[project]
name = "neat-proj"
version = "0.1.0"
description = "NEAT from scratch, Backprop-NEAT in JAX, and NEAT agents for Slime Volleyball"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.12.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optax>=0.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
extend-exclude = ["slime/slimevolley.py", "results/logs"]   # vendored game code; raw outputs kept verbatim
